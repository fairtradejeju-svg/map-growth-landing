<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Into Reading 워크북 · MAP Growth Support Korea</title>
<meta name="description" content="Into Reading(천재교과서 ELT) Grade 1~5 워크북과 답지를 학년·모듈별로 내려받으세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0F6E56; --green-deep:#0D5C48;
  --ink:#1A1A2E; --ink-sub:#5A6178; --ink-light:#8B8FA3;
  --bg:#FBF9F4; --surface:#FFFFFF; --border:#E9E5DC; --cream:#FFF6E0;
  --font-round:'Quicksand','Noto Sans KR',sans-serif;
  --font-base:'Noto Sans KR','Inter',-apple-system,sans-serif;
  --font-num:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-base);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

/* 상단 바 (MAP 홈과 연결) */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:-.02em}
.brand .mk{font-family:var(--font-num);font-size:12px;font-weight:600;color:#fff;background:var(--green);padding:4px 8px;border-radius:5px;letter-spacing:.5px}
.back{font-size:13px;font-weight:600;color:var(--green);display:inline-flex;align-items:center;gap:6px}
.back svg{width:15px;height:15px}

/* 히어로 — Into Reading 곡선 헤더 */
.ir-hero{position:relative;overflow:hidden;background:var(--cream);padding:44px 26px 40px}
.ir-hero::before{content:'';position:absolute;top:-120px;left:-8%;right:-8%;height:220px;background:linear-gradient(120deg,#B73680 0%,#E0563E 50%,#F58A1F 100%);border-radius:0 0 55% 55% / 0 0 100% 100%;opacity:.14}
.ir-hero .in{position:relative;z-index:1;max-width:1080px;margin:0 auto}
.ir-eyebrow{font-family:var(--font-num);font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#B73680}
.ir-hero h1{font-family:var(--font-round);font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:700;letter-spacing:-.02em;margin:8px 0 10px;line-height:1.2}
.ir-hero p{font-size:15px;color:var(--ink-sub);max-width:620px}
.ir-hero .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}
.ir-hero .meta span{font-size:13px;color:var(--ink-sub);display:inline-flex;align-items:center;gap:6px}
.ir-hero .meta b{font-family:var(--font-num);color:var(--green-deep);font-weight:600}

/* 본문 */
.wrap{max-width:1080px;margin:0 auto;padding:34px 26px 70px}

/* 학년 탭 */
.grade-tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.grade-tabs button{font-family:var(--font-round);font-size:15px;font-weight:600;color:var(--ink-sub);background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:10px 22px;cursor:pointer;transition:all .16s}
.grade-tabs button:hover{border-color:#B7368066;color:var(--ink)}
.grade-tabs button.active{background:var(--green);border-color:var(--green);color:#fff}
.grade-hint{font-size:13px;color:var(--ink-light);margin-bottom:24px}

/* 모듈 그리드 */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(26,26,46,.09)}
.mod-top{padding:17px 19px 14px;display:flex;align-items:center;gap:13px;position:relative}
.mod-top::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc)}
.mod-num{flex-shrink:0;width:46px;height:46px;border-radius:14px;background:var(--mc-soft);color:var(--mc);font-family:var(--font-round);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.mod-title{font-family:var(--font-round);font-weight:600;font-size:16px;letter-spacing:-.01em}
.mod-title small{display:block;font-family:var(--font-base);font-weight:400;font-size:12px;color:var(--ink-light);margin-top:2px}
.mod-dl{display:flex;gap:9px;padding:0 19px 18px}
.mod-dl a{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;padding:11px 10px;border-radius:11px;transition:all .16s}
.mod-dl .wb{background:var(--mc);color:#fff}
.mod-dl .wb:hover{filter:brightness(.93)}
.mod-dl .an{background:#fff;color:var(--ink-sub);border:1.5px solid var(--border)}
.mod-dl .an:hover{border-color:var(--mc);color:var(--mc)}
.mod-dl svg{width:15px;height:15px}

.foot{max-width:1080px;margin:0 auto;padding:26px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-light);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:560px){ .mod-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><span class="mk">MAP</span> MAP Growth Support Korea</a>
  <a href="index.html#resources" class="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    자료실로
  </a>
</div>

<section class="ir-hero">
  <div class="in">
    <div class="ir-eyebrow">Into Reading · 천재교과서 ELT</div>
    <h1>Into Reading 워크북</h1>
    <p>미국 교과서 Into Reading(HMH) 기반 학년별 워크북과 답지입니다. Grade를 고르고 모듈별로 내려받으세요.</p>
    <div class="meta">
      <span>Grade <b>1</b>~<b>5</b></span>
      <span>학년당 <b>10</b>개 모듈</span>
      <span>워크북 · 답지 <b>PDF</b></span>
    </div>
  </div>
</section>

<div class="wrap">
  <div class="grade-tabs" id="gradeTabs"></div>
  <div class="grade-hint" id="gradeHint"></div>
  <div class="mod-grid" id="modGrid"></div>
</div>

<div class="foot">
  <span>Into Reading(천재교과서 ELT) · MAP Growth Support Korea</span>
  <span>자료는 순차적으로 업데이트됩니다</span>
</div>

<script>
  var GRADES = ['G1','G2','G3','G4','G5'];
  var COLORS = [
    {c:'#B73680',s:'#F7E1EE'}, {c:'#2C9DCB',s:'#DDF1F8'}, {c:'#7DB72F',s:'#E8F3D5'},
    {c:'#F58A1F',s:'#FCE9D3'}, {c:'#7C5CBF',s:'#E9E2F6'}, {c:'#0E9C8E',s:'#D6F1EE'},
    {c:'#E0563E',s:'#FADFD8'}, {c:'#4256B3',s:'#E0E4F5'}, {c:'#E0509B',s:'#FADFEC'},
    {c:'#D08A17',s:'#F8EBCC'}
  ];
  function render(grade){
    var grid = document.getElementById('modGrid');
    grid.innerHTML = '';
    for(var m=1;m<=10;m++){
      var col = COLORS[(m-1)%COLORS.length];
      var wb = 'resources/into-reading/'+grade+'/'+grade+'_M'+m+'_workbook.pdf';
      var an = 'resources/into-reading/'+grade+'/'+grade+'_M'+m+'_answer.pdf';
      var card = document.createElement('div');
      card.className = 'mod-card';
      card.style.setProperty('--mc', col.c);
      card.style.setProperty('--mc-soft', col.s);
      card.innerHTML =
        '<div class="mod-top">'+
          '<div class="mod-num">'+m+'</div>'+
          '<div class="mod-title">Module '+m+'<small>'+grade.replace("G","Grade ")+' · 워크북 + 답지</small></div>'+
        '</div>'+
        '<div class="mod-dl">'+
          '<a class="wb" href="'+wb+'" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>워크북</a>'+
          '<a class="an" href="'+an+'" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>답지</a>'+
        '</div>';
      grid.appendChild(card);
    }
    document.getElementById('gradeHint').textContent = grade.replace('G','Grade ') + ' 워크북 10개 모듈';
    var btns = document.querySelectorAll('.grade-tabs button');
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', btns[i].dataset.g === grade); }
  }
  (function(){
    var tabs = document.getElementById('gradeTabs');
    GRADES.forEach(function(g){
      var b = document.createElement('button');
      b.textContent = g.replace('G','Grade ');
      b.dataset.g = g;
      b.onclick = function(){ render(g); };
      tabs.appendChild(b);
    });
    render('G1');
  })();
</script>
</body>
</html>
